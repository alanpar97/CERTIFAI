[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "certifai"
version = "0.1.0"
description = "A python implementation of CERTIFAI framework for machine learning models' explainability"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Iacopo Ghinassi" },
    { name = "Alan Paredes" },
]
keywords = [
    "explainability",
    "fairness",
    "machine-learning",
    "robustness",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.3.2",
]

[project.urls]
Repository = "https://github.com/alanpar97/CERTIFAI"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
